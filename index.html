<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Jazmín</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1a33;--line:#7dd3fc;--plan:.16;--text:#f1f5f9;--muted:#a5b4cc;--gold:#fbbf24;--wall:#16284a;--win:#26406e;--ground:#7dd3fc;--btn-ink:#1c1100;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e8f1fb;--line:#1e40af;--plan:.2;--text:#0f1b3d;--muted:#475569;--gold:#b45309;--wall:#dbe8f8;--win:#b6cdee;--ground:#1e40af;--btn-ink:#fff}}
:root[data-theme="dark"]{--bg:#0b1a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:400 16px/1.6 'Montserrat',system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;opacity:var(--plan);color:var(--line);z-index:0}
main{position:relative;z-index:1;min-height:100vh;max-width:760px;margin:0 auto;padding:28px 18px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
h1{font-family:'Cinzel',Georgia,serif;font-size:clamp(1.6rem,5vw,2.4rem);margin:0;letter-spacing:.02em}
.sub{margin:0;color:var(--muted);font-weight:300}
.scene{width:100%;max-width:520px;height:auto;display:block}
.scene *{transform-box:fill-box}
.ground{stroke:var(--ground);stroke-width:2}
.crane{stroke:var(--ground);fill:none;stroke-width:2.5;opacity:.85}
.found{fill:var(--ground);opacity:.9;transform:scaleX(0);transform-origin:center;transition:transform 1s ease-out}
.found.in{transform:scaleX(1)}
.floor{opacity:0;transform:translateY(-70px);transition:transform .8s cubic-bezier(.3,1.5,.5,1),opacity .25s}
.floor.in{opacity:1;transform:none}
.floor rect.w{fill:var(--wall);stroke:var(--line);stroke-width:1.5}
.win{fill:var(--win);transition:fill .5s,filter .5s}
.win.lit{fill:var(--gold);filter:drop-shadow(0 0 5px var(--gold))}
.roof polygon{fill:var(--wall);stroke:var(--gold);stroke-width:2}
.sign{opacity:0;transition:opacity 1s;fill:var(--gold);font:700 15px 'Cinzel',serif;text-anchor:middle}
.sign.in{opacity:1}
#line{stroke:var(--ground);stroke-width:1.5;transform-origin:50% 0;transition:transform 1.1s ease-in-out}
#load{transition:transform 1.1s ease-in-out}
#load rect{fill:var(--wall);stroke:var(--gold);stroke-width:1.5}
#caption{min-height:5.6em;max-width:30em;display:flex;align-items:center;justify-content:center;font-size:clamp(1.05rem,3.4vw,1.3rem);line-height:1.45;transition:opacity .35s}
#caption.out{opacity:0}
#caption strong{color:var(--gold)}
.dots{display:flex;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);transition:background .4s}
.dots i.on{background:var(--gold);border-color:var(--gold)}
#play{display:flex;align-items:center;gap:12px;font:600 1rem 'Montserrat',sans-serif;padding:14px 30px 14px 20px;border-radius:999px;border:0;cursor:pointer;background:var(--gold);color:var(--btn-ink);transition:transform .15s,opacity .2s}
#play:hover{transform:scale(1.04)}
#play:disabled{opacity:.45;cursor:default;transform:none}
#play:focus-visible{outline:3px solid var(--text);outline-offset:3px}
#play svg{width:26px;height:26px}
@media(prefers-reduced-motion:reduce){.found,.floor,#line,#load,.sign,.win{transition-duration:.01s}}
</style>
</head>
<body>
<svg id="bg" aria-hidden="true" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" fill="none" stroke="currentColor" stroke-width="1.5" font-family="Montserrat,sans-serif" font-size="13">
  <!-- planta de casa -->
  <g transform="translate(40 60)">
    <rect x="0" y="0" width="420" height="300" stroke-width="4"/>
    <path d="M200 0V150M0 150H200M200 190H420M300 190V300M120 150V300M120 230H0"/>
    <path d="M200 150a40 40 0 0 1 40 40M120 255a30 30 0 0 0 -30 -25M300 250a35 35 0 0 1 35 40"/>
    <path d="M60 0v6M140 0v6M300 0v6M360 0v6" stroke-width="8"/>
    <g fill="currentColor" stroke="none"><text x="70" y="85">SALA</text><text x="270" y="85">COCINA</text><text x="30" y="205">REC. 1</text><text x="140" y="270">BAÑO</text><text x="330" y="250">REC. 2</text></g>
    <path d="M0 330H420M0 322v16M420 322v16M-30 0V300M-38 0h16M-38 300h16"/><text x="190" y="352" fill="currentColor" stroke="none">12.00 m</text>
  </g>
  <!-- alzado de edificio -->
  <g transform="translate(760 80)">
    <rect x="0" y="0" width="330" height="520" stroke-width="3"/>
    <path d="M0 87H330M0 174H330M0 261H330M0 348H330M0 435H330M110 0V520M220 0V520"/>
    <g stroke-width="1"><path d="M20 20h70v50h-70zM130 20h70v50h-70zM240 20h70v50h-70zM20 107h70v50h-70zM130 107h70v50h-70zM240 107h70v50h-70zM20 194h70v50h-70zM130 194h70v50h-70zM240 194h70v50h-70z"/></g>
    <path d="M380 0V520M372 0h16M372 520h16"/><text x="395" y="265" fill="currentColor" stroke="none">18.50 m</text>
  </g>
  <!-- corte de casa -->
  <g transform="translate(120 480)">
    <path d="M0 200V90L160 0L320 90V200ZM0 90H320M60 200V140h50v60M200 120h70v50h-70z"/>
    <path d="M-30 200H350" stroke-width="3"/><path d="M335 0V200M327 0h16M327 200h16"/>
  </g>
  <!-- cotas sueltas y círculos de detalle -->
  <circle cx="600" cy="400" r="70"/><circle cx="600" cy="400" r="45" stroke-dasharray="6 6"/><path d="M520 400h160M600 320v160" stroke-dasharray="14 5 2 5"/>
  <path d="M520 700h300M520 692v16M820 692v16" /><text x="640" y="690" fill="currentColor" stroke="none">escala 1:100</text>
</svg>

<main>
  <h1>Para Jazmín</h1>
  <p class="sub">Toca play y mira cómo se levanta un edificio.</p>

  <svg class="scene" viewBox="0 0 400 285" role="img" aria-label="Edificio que se construye piso por piso con una grúa">
    <path class="ground" d="M10 262H390"/>
    <!-- grúa -->
    <g class="crane"><path d="M96 262V22M108 262V22M96 60l12-12M96 100l12-12M96 140l12-12M96 180l12-12M96 220l12-12M96 40l12 12M96 80l12 12M96 120l12 12M96 160l12 12M96 200l12 12M96 240l12 12M60 22H300M96 22L200 6L300 22M96 6v16"/><rect x="56" y="14" width="26" height="12" fill="currentColor" style="color:var(--ground)"/></g>
    <rect id="line" x="199" y="22" width="2" height="230" style="fill:var(--ground);transform:scaleY(.05)"/>
    <g id="floors"></g>
    <rect id="found" class="found" x="126" y="254" width="148" height="8" />
    <g id="roof" class="floor roof"><polygon points="132,70 200,38 268,70"/></g>
    <text id="sign" class="sign" x="200" y="31">Jazmín</text>
    <g id="load" style="transform:translateY(0)"><rect x="180" y="22" width="40" height="14" rx="2"/></g>
  </svg>

  <div id="caption" aria-live="polite">Esto es para ti, Jazmín. Dale play.</div>
  <div class="dots" id="dots" aria-hidden="true"></div>

  <button id="play"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="11" opacity=".18"/><path d="M9 6.5v11l9-5.5z"/></svg><span id="ptxt">Play</span></button>
</main>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg',$=function(i){return document.getElementById(i)};
  var floorsG=$('floors'),floors=[],H=38,BASE=254,N=5;
  for(var k=0;k<N;k++){
    var y=BASE-H*(k+1),g=document.createElementNS(NS,'g');g.setAttribute('class','floor');
    var r=document.createElementNS(NS,'rect');r.setAttribute('class','w');r.setAttribute('x',132);r.setAttribute('y',y);r.setAttribute('width',136);r.setAttribute('height',H);g.appendChild(r);
    for(var j=0;j<3;j++){var w=document.createElementNS(NS,'rect');w.setAttribute('class','win');w.setAttribute('x',146+j*38);w.setAttribute('y',y+9);w.setAttribute('width',24);w.setAttribute('height',20);w.setAttribute('rx',2);g.appendChild(w)}
    floorsG.appendChild(g);floors.push({g:g,y:y});
  }
  var steps=[
    'Primero, los cimientos. Una buena obra empieza firme, <strong>como tú</strong>: constante y de las que sostienen.',
    'Primer piso: <strong>tu talento</strong>. Ves un terreno vacío y ya sabes lo que puede llegar a ser.',
    'Segundo piso: <strong>tu criterio</strong>. Cada detalle que eliges tiene sentido y se nota.',
    'Tercer piso: <strong>tu fuerza</strong>. Cuando el proyecto se complica, tú lo sacas adelante.',
    'Cuarto piso: <strong>tu estilo</strong>. Hasta un plano se ve más bonito cuando lo firmas tú.',
    'Quinto piso: <strong>tu luz</strong>. Donde llegas tú, todo se ilumina.',
    'Y ahora, el techo. Porque cuidas a todo el equipo como si fuera tu obra favorita.',
    'Mira cómo brilla. El mejor edificio no es el del plano: es la persona que lo imaginó.<br><strong>Jazmín, eres la arqui más guapa y el pilar de esta empresa.</strong>'
  ];
  var dotsEl=$('dots');steps.forEach(function(){dotsEl.appendChild(document.createElement('i'))});
  var dots=dotsEl.children,cap=$('caption'),btn=$('play'),running=false;
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
  async function say(i){cap.classList.add('out');await sleep(350);cap.innerHTML=steps[i];cap.classList.remove('out');dots[i].classList.add('on')}
  async function hookTo(topY){
    var d=Math.max(0,topY-40);
    $('load').style.transform='translateY('+d+'px)';
    $('line').style.transform='scaleY('+Math.max(.05,(d+12)/230)+')';
    await sleep(1150);
  }
  async function hookUp(){$('load').style.transform='translateY(0)';$('line').style.transform='scaleY(.05)';await sleep(1150)}
  function reset(){
    $('found').classList.remove('in');$('roof').classList.remove('in');$('sign').classList.remove('in');
    floors.forEach(function(f){f.g.classList.remove('in');[].forEach.call(f.g.querySelectorAll('.win'),function(w){w.classList.remove('lit')})});
    [].forEach.call(dots,function(d){d.classList.remove('on')});
  }
  async function build(){
    if(running)return;running=true;btn.disabled=true;reset();
    $('load').style.opacity=1;
    await say(0);$('found').classList.add('in');await sleep(1600);
    for(var k=0;k<N;k++){
      await say(k+1);
      await hookTo(floors[k].y);
      $('load').style.opacity=0;floors[k].g.classList.add('in');await sleep(900);
      $('load').style.opacity=1;await hookUp();
    }
    await say(6);
    await hookTo(70);$('load').style.opacity=0;$('roof').classList.add('in');await sleep(900);$('load').style.opacity=1;await hookUp();
    await say(7);
    var wins=document.querySelectorAll('.floor .win');
    for(var i=0;i<wins.length;i++){wins[i].classList.add('lit');await sleep(110)}
    $('sign').classList.add('in');
    $('ptxt').textContent='Ver otra vez';btn.disabled=false;running=false;
  }
  btn.addEventListener('click',build);
})();
</script>
</body>
</html>
